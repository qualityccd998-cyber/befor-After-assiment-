<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة المشرف</title>
  <link rel="stylesheet" href="styles.css?v=20260918-4" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>لوحة المشرف</h1>
      <p>متابعة نتائج التقييم القبلي والبعدي</p>
      <a class="admin-link" href="index.html">العودة للتقييم</a>
    </header>

    <section id="loginCard" class="card">
      <h2>تسجيل دخول المشرف</h2>
      <label>البريد الإلكتروني</label>
      <input id="adminEmail" type="email" autocomplete="username" />
      <label>كلمة المرور</label>
      <input id="adminPassword" type="password" autocomplete="current-password" />
      <button id="loginBtn" class="primary">دخول</button>
      <p id="loginError" class="error"></p>
    </section>

    <section id="dashboard" class="hidden">
      <section class="stats-grid">
        <div class="stat-card"><span>عدد المحاولات</span><strong id="statAttempts">0</strong></div>
        <div class="stat-card"><span id="statAverageLabel">المتوسط العام</span><strong id="statAverage">0%</strong></div>
        <div class="stat-card"><span>قبلي</span><strong id="statPre">0</strong></div>
        <div class="stat-card"><span>بعدي</span><strong id="statPost">0</strong></div>
      </section>

      <section class="card">
        <div class="toolbar">
          <div>
            <h2 id="resultsTitle">النتائج</h2>
            <p id="filterSummary" class="muted results-summary">عرض جميع النتائج</p>
          </div>
          <div>
            <button id="refreshBtn" class="secondary">تحديث</button>
            <button id="logoutBtn" class="danger">تسجيل الخروج</button>
          </div>
        </div>

        <div class="result-filters" role="group" aria-label="فرز نتائج التقييم">
          <button id="filterAllBtn" class="filter-btn active" data-filter="all">
            <span class="filter-icon">▦</span>
            <span>جميع النتائج</span>
            <strong id="filterAllCount">0</strong>
          </button>
          <button id="filterPreBtn" class="filter-btn" data-filter="قبلي">
            <span class="filter-icon">◀</span>
            <span>نتائج القبلي</span>
            <strong id="filterPreCount">0</strong>
          </button>
          <button id="filterPostBtn" class="filter-btn" data-filter="بعدي">
            <span class="filter-icon">▶</span>
            <span>نتائج البعدي</span>
            <strong id="filterPostCount">0</strong>
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>الاسم</th><th>النوع</th><th>الدرجة</th><th>النسبة</th><th>وقت الإرسال</th><th>التفاصيل</th></tr></thead>
            <tbody id="attemptRows"></tbody>
          </table>
        </div>
        <p id="dashboardError" class="error"></p>
      </section>
    </section>
  </main>

  <dialog id="detailsDialog">
    <div class="toolbar"><h3 id="detailsTitle">تفاصيل الإجابات</h3><button id="closeDetails" class="secondary">إغلاق</button></div>
    <div id="detailsBody" class="review-list"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260918-4"></script>
  <script src="admin.js?v=20260918-4"></script>
</body>
</html>
